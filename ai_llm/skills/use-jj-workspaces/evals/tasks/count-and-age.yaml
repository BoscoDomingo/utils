id: jj-workspaces-count-age-001
name: Count and Outdated Workspace Recommendations
description: >-
  Dry-run judgement scenario. Must recommend trimming A's very outdated
  workspaces and recommend trimming B or ask whether its count is acceptable,
  using judgement rather than a hard count/age limit. C needs no warning. Must
  stay fresh by default and never remove, forget, update, or reuse workspaces
  merely because they are old; any trimming needs approval.
tags:
  - positive-trigger
inputs:
  prompt: |
    Explain how you would handle a new isolation request in each repository
    below. Give recommendations only; no commands or file writes. Repository A
    has two workspaces far behind the intended base. Repository B has eight
    recent workspaces, perhaps all active. Repository C has three recent
    workspaces. The user has not asked for cleanup or reuse.
expected:
  should_trigger: true
graders:
  - type: text
    name: recommends-without-acting
    config:
      contains:
        - "trim"
        - "fresh"
        - "approv"
      not_contains:
        - "jj workspace forget"

id: jj-workspaces-positive-trigger-001
name: Include Uncommitted Work Via Approved Commit
description: >-
  Dry-run scenario. Must ask approval to commit current uncommitted work first
  (e.g. jj commit), then pin BASE to the resulting commit (@-), never the
  source's live @. Must propose one approved command from the source workspace:
  jj workspace add --name copy-N -r "<BASE>" "<absolute-sibling-path>", with no
  follow-up commands. Must not run commands. Keyword checks are smoke checks;
  review the trace for approval gates and base selection.
tags:
  - positive-trigger
inputs:
  prompt: |
    Use use-jj-workspaces to explain how you would give a parallel agent an
    isolated copy of this jj repository that starts from my current uncommitted
    edits. This is a hypothetical dry run: do not run commands or write files.
expected:
  should_trigger: true
graders:
  - type: text
    name: commits-before-basing
    config:
      contains:
        - " commit"
        - "approv"
        - "workspace add"
      not_contains:
        - "--ignore-working-copy workspace add"

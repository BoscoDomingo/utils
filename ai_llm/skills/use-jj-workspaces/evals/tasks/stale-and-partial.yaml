id: jj-workspaces-recovery-001
name: Reuse By Request and Partial Creation
description: >-
  Dry-run explicit reuse. Must ask about active users/jobs and filesystem work
  on copy-1; recorded emptiness alone is insufficient. Any snapshot needs
  approval with automatic stale recovery disabled. Must stop and ask on copy-2
  and copy-3 without repairing or moving them. Reuse copy-4 only after
  verification, without repositioning. Leave partial creation intact and report
  recovery needs; no automatic cleanup or silent fresh substitution.
tags:
  - positive-trigger
inputs:
  prompt: |
    Explain hypothetical explicit reuse requests without commands or file writes.
    copy-1 has recorded empty @ above BASE, but background-job activity and
    filesystem edits are unknown. copy-2 is stale. copy-3 is empty above a
    different base with unbookmarked work. copy-4 is confirmed inactive and clean,
    undescribed, conflict-free, non-divergent, directly above BASE, with no
    references, descendants, or other workspace sharing @; path/repository,
    sparse patterns and colocation match. Separately, a fresh creation the user
    allowed fails after leaving a .jj directory and registration.
expected:
  should_trigger: true
graders:
  - type: text
    name: verifies-before-reuse
    config:
      contains:
        - "snapshot"
        - "approv"
        - "recover"
      not_contains:
        - "rm -rf"
